# Server Configuration
server.port=8080
server.servlet.context-path=/

# MongoDB Connection
spring.data.mongodb.uri=mongodb://localhost:27017/tamilemotedb
spring.data.mongodb.auto-index-creation=true

# Character Encoding for Tamil UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8

# JSON formatting
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Application Info
app.name=Tamil Emotion Reasoner AI
app.version=1.0.0
app.description=Morphology-Aware Tamil Emotion Reasoner & Continual Adaptation System

# JWT Security Configuration (HMAC-SHA256 256-bit Secret Key)
jwt.secret=tamilEmotionAiSecretKey2026SecureHmacSha256MustBeAtLeast32BytesLongForSecurity!
jwt.expirationMs=86400000

